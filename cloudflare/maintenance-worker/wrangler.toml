name = "familijna"
main = "src/index.js"
compatibility_date = "2024-01-01"
# Worker tylko pod domenami familijna.app (trasy w panelu Cloudflare);
# adres *.workers.dev i podglądy wersji omijałyby Cloudflare Access.
workers_dev = false
preview_urls = false

# Pliki strony (Workers Static Assets) — artefakt `node scripts/build-public.cjs`
# (zminifikowany web/ z wersjami ?v= z treści), budowany przed `wrangler deploy`.
# run_worker_first: każde żądanie najpierw w Workerze (bramka przerwy, blokady
# ścieżek, SSR, nagłówki bezpieczeństwa i cache) — Worker sam pobiera pliki
# przez env.ASSETS. html_handling = "none": dokładne pliki bez przekierowań
# ukośnika (Worker prosi wprost o /strona/index.html); not_found_handling
# "none": 404 bez treści, własną stronę 404 podaje Worker.
[assets]
directory = "../../_site_public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[kv_namespaces]]
binding = "MAINT_KV"
id = "a23c036852434c5da77287d82973f183"

[triggers]
crons = ["0 3 * * *"]

[vars]
SUPABASE_URL = "https://api.familijna.app"
# Publiczny klucz anon (ten sam co w web/shared/js/core/supabase.js): logowanie
# po nazwie wołane jak z przeglądarki, bez uprawnień serwisowych (captcha GoTrue).
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImF1ZCI6ImF1dGhlbnRpY2F0ZWQiLCJpYXQiOjE3NzIyMTEyNTAsImV4cCI6MjA4NzU3MTI1MCwicm9sZSI6ImFub24ifQ.9Hg8RB6iC72o2ommzcYUNQWnPSzsDyUdxwQR9PGcF4U"
[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
