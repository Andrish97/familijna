<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="app-version" content="v2026-11-08T19051"/>


  <meta charset="UTF-8"/>
  <meta name="i18n-parts" content="logos resources">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"/>
  <script src="/shared/js/core/page-boot.js?v=v2026-11-08T19051"></script>
  <link rel="preconnect" href="https://api.familijna.app" crossorigin>
  <link rel="canonical" href="https://www.familijna.app/logos/"/>
  <title data-i18n="logoEditor.title">Familijna — logo</title>

  <link rel="icon" href="/favicon.ico?v=v2026-11-08T19051"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icon-apple-touch-180.png?v=v2026-11-08T19051"/>
  <link rel="manifest" href="/manifest.json?v=v2026-11-08T19051"/>
  <meta name="theme-color" content="#050914"/>
  <link rel="stylesheet" href="/shared/css/blocking-overlay.css?v=v2026-11-08T19051" />
  <link rel="stylesheet" href="/shared/style/tokens.css?v=v2026-11-08T19051"/>
  <link rel="stylesheet" href="/shared/style/base.css?v=v2026-11-08T19051"/>
  <link rel="stylesheet" href="/shared/style/components.css?v=v2026-11-08T19051"/>
  <link rel="stylesheet" href="/shared/style/layout.css?v=v2026-11-08T19051"/>
  <link rel="stylesheet" href="/shared/style/utilities.css?v=v2026-11-08T19051"/>
  <link rel="stylesheet" href="/logos/css/logo.css?v=v2026-11-08T19051"/>
  <script type="module" src="/shared/js/core/device-attrs.js?v=v2026-11-08T19051"></script>

  <script>document.documentElement.classList.add('page-loading')</script>

  <script src="/shared/vendor/supabase-js.js?v=v2026-11-08T19051" defer></script>

  <script type="module" src="/logos/js/list.js?v=v2026-11-08T19051" defer></script>
  <script src="/shared/js/core/security-warning.js?v=v2026-11-08T19051" defer></script>

</head>

<body class="page-fit logo-body skel-body">
  <!-- TOPBAR (jak games). Lista logo; edytory to osobne strony /logos/editor/<tryb>/ -->
  <header class="topbar topbar-layout-4">
    <div class="topbar-section topbar-section-1">
      <div class="brand" id="brandTitle">FAMILIJNA</div>
      <button class="btn" id="btnBack" type="button" data-i18n-icon="arrow-left">Wstecz<span class="badge" id="gamesCopiesNavBadge" aria-hidden="true"></span></button>
    </div>
    <div class="topbar-section topbar-section-2">
      <button class="btn" id="btnFriends" type="button" data-nav-hidden="true" hidden><span data-i18n="nav.menu.friends" data-i18n-icon-after="people">Znajomi</span><span class="badge" data-nav-contact-count="friends" aria-hidden="true"></span></button>
    </div>
    <div class="topbar-section topbar-section-3">
      <button class="btn" id="btnManual" type="button" data-i18n-aria-label="common.manualLabel" data-i18n-title="common.manualLabel" aria-label="Wskazówki" title="Wskazówki"><i class="ico" data-icon="info"></i></button>
    </div>
    <div class="topbar-section topbar-section-4">
      <span class="who" id="who"></span>
      <button class="btn" id="btnLogout" type="button" data-i18n="common.authEntry" data-i18n-icon="person">Zaloguj / Załóż konto</button>
    </div>
  </header>

  <main class="wrap logoWrap">

    <!-- =========================
         LIST VIEW (KAFELKI)
    ========================== -->
    <section id="listShell">
      <div class="bar">
        <div>
          <div class="title" data-i18n="logoEditor.list.title">Moje loga</div>
          <div class="hint" id="hint" data-i18n="common.renameTileHint"></div>
        </div>

        <div class="actions">
          <button class="btn sm gold" id="btnEdit" type="button" disabled><i class="ico" data-icon="edit-paper" aria-hidden="true"></i><span class="action-label" data-i18n="logoEditor.list.edit">Edytuj</span></button>
          <button class="btn sm" id="btnPreview" type="button" disabled><i class="ico" data-icon="eye" aria-hidden="true"></i><span class="action-label" data-i18n="logoEditor.list.preview">Podgląd</span></button>
        </div>
      </div>

      <section class="games-shell logoShell tabs-card logo-tabs-card" data-skel-step>
        <div class="tabs-strip" role="tablist" aria-label="Typ logo">
          <div class="tab-slot slot-logo-text" data-copy-kind="logo" data-copy-variant="GLYPH_30x10" data-copy-mode="TEXT">
            <button class="tab-label active" id="tabLogoText" type="button" role="tab"><span data-i18n="logoEditor.modes.text">Tekst</span><span class="badge" aria-hidden="true"></span></button>
          </div>
          <div class="tab-slot slot-logo-draw" data-copy-kind="logo" data-copy-variant="PIX_150x70" data-copy-mode="DRAW">
            <button class="tab-label" id="tabLogoDraw" type="button" role="tab"><span data-i18n="logoEditor.modes.draw">Rysunek</span><span class="badge" aria-hidden="true"></span></button>
          </div>
          <div class="tab-slot slot-logo-image" data-copy-kind="logo" data-copy-variant="PIX_150x70" data-copy-mode="IMAGE">
            <button class="tab-label" id="tabLogoImage" type="button" role="tab"><span data-i18n="logoEditor.modes.image">Obraz</span><span class="badge" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="card games-card logoCard">
          <div class="grid logoGridBig" id="grid"></div>

          <!-- dół jak games -->
          <div class="list-toolbar">
            <div class="list-toolbar-left"></div>
            <div class="list-toolbar-right">
              <button class="btn sm" id="btnDuplicate" type="button" disabled data-i18n-title="resourceDuplicate.action" data-i18n-aria-label="resourceDuplicate.action"><i class="ico" data-icon="duplicate" data-icon-animation="copy" aria-hidden="true"></i><span class="only-desktop" data-i18n="resourceDuplicate.action">Powiel</span></button>
              <button class="btn sm" id="btnExport" type="button" disabled data-i18n-title="logoEditor.list.export" data-i18n-aria-label="logoEditor.list.export"><i class="ico" data-icon="download" aria-hidden="true"></i><span class="only-desktop" data-i18n="logoEditor.list.export">Eksport</span></button>
              <button class="btn sm" id="btnImport" type="button" data-i18n-title="logoEditor.list.import" data-i18n-aria-label="logoEditor.list.import"><i class="ico" data-icon="upload" aria-hidden="true"></i><span class="only-desktop" data-i18n="logoEditor.list.import">Import</span></button>
              <button class="btn sm" id="btnSendCopy" type="button" disabled data-i18n-title="resourceSend.action" data-i18n-aria-label="resourceSend.action"><i class="ico" data-icon="envelope-out" aria-hidden="true"></i><span class="only-desktop" data-i18n="resourceSend.action">Wyślij</span></button>
            </div>
          </div>
        </div>
      </section>

    </section>


  <!-- Modal: import logo -->
  <div class="overlay modal--sheet" id="logoImportOverlay" hidden>
    <div class="modal modal--medium">
      <div class="mHead">
        <div class="mTitle" data-i18n="logoEditor.import.title">Import logo</div>
        <button class="btn sm" id="btnLogoImportCancel" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
      </div>

      <div class="importRow import-file-picker">
        <input id="inpImportLogoFile" type="file" accept=".famlogo,.json,application/json" hidden>
        <button class="btn sm" id="btnImportLogoChoose" type="button" data-i18n="common.filePicker.choose" data-i18n-icon="file-doc">Wybierz plik</button>
        <span class="import-file-name" id="logoImportFileName" data-i18n="common.filePicker.none" aria-live="polite">Nie wybrano pliku</span>
      </div>

      <!-- Podgląd canvas -->
      <div id="logoImportPreviewWrap" class="import-preview import-preview--media" hidden>
        <canvas id="logoImportPreviewCanvas"></canvas>
      </div>
      <!-- Błąd -->
      <div id="logoImportErr" class="field-error" role="alert" hidden></div>

      <!-- Pasek postępu (podczas zapisu) -->
      <div id="logoImportProg" class="uni-progress" hidden>
        <div class="uni-progress-row">
          <div id="logoImportStep" class="uni-progress-step">—</div>
          <div id="logoImportCount" class="uni-progress-count">0/0</div>
        </div>
        <div class="progress">
          <div id="logoImportBar" class="progress-bar"></div>
        </div>
        <div class="importMsg" id="logoImportMsg"></div>
      </div>

      <div class="importRow modal-actions">
        <button class="btn sm" id="btnLogoImportCancelAction" type="button" data-i18n="common.cancel" data-i18n-icon="close">Anuluj</button>
        <button class="btn sm gold" id="btnLogoImportConfirm" type="button" disabled data-i18n="logoEditor.import.confirm" data-i18n-icon="upload">Importuj</button>
        <button class="btn sm gold" id="btnLogoImportDone" type="button" data-i18n="logoEditor.import.done" data-i18n-icon="check" hidden>Gotowe</button>
      </div>
    </div>
  </div>

    <!-- Fullscreen preview (MODAL z X) -->
    <div class="overlay modal--sheet" id="previewOverlay" hidden>
      <div class="modal modal--media previewModal">
        <div class="previewModalTitle">
          <div>
            <div class="mTitle" data-i18n="logoEditor.preview.title">Podgląd</div>
            <div class="mSub" data-i18n="logoEditor.preview.subtitle">Tak będzie wyglądać logo na wyświetlaczu</div>
          </div>
          <button class="btn sm" id="btnPreviewClose" type="button" aria-label="Zamknij" data-i18n-aria-label="common.modal.closeLabel"><i class="ico" data-icon="close"></i></button>
        </div>
        <div class="previewModalCanvas sheet-fill">
          <canvas id="bigPreviewFull" width="2400" height="1100"></canvas>
        </div>
      </div>
    </div>


    <div class="footer">
      <div data-i18n="common.footer.left">© 2026 Familijna — system do gry na żywo</div>
      <button class="btn-contact-footer" type="button" data-contact-modal data-i18n="common.contactBtn">Kontakt</button>
    </div>
  </main>


  <script type="module" src="/shared/js/core/contact-modal.js?v=v2026-11-08T19051"></script>
  <script type="module" src="/shared/js/core/topbar-controller.js?v=v2026-11-08T19051"></script>

</body>
</html>
