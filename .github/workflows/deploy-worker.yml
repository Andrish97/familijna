name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/**"
      - "!cloudflare/legacy-domain-worker/**"
      - "web/shared/js/core/home-seo.js"
      - "web/shared/js/core/public-seo.js"
      - "web/marketplace/js/public.js"
      - "web/shared/js/core/answer-order.js"
      - "web/shared/js/core/icons.js"
      - "web/shared/translation/*/marketplace.js"
      - "web/manual/content/**"
      - "web/manual/js/render.js"
      - "web/shared/translation/*/manual.js"
      - "web/shared/translation/*/privacy.js"
      - "web/shared/translation/*/home.js"
      - "web/shared/translation/*/common.js"
      - "web/shared/js/core/go-contract.js"
      - "web/shared/js/core/resource-clone-plan.js"
      - "web/shared/js/core/base-transfer-format.js"
      - "web/shared/js/core/game-transfer-format.js"
      - "web/shared/js/core/logo-transfer-source.js"
      - "web/shared/js/core/logo-image-data.js"
      - "web/logos/js/package.js"
      - "web/logos/js/render.js"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

# E24 R26: token GitHuba tylko do odczytu.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    # E24 R5: sekrety serwera i Cloudflare w środowisku „production” (reguła
    # gałęzi main ustawiana w GitHubie) — gałąź z podmienionym workflow ich nie dostanie.
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare/maintenance-worker

      - name: Test Worker rendering and HTTPS
        run: npm test
        working-directory: cloudflare/maintenance-worker

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3 (E24 R16: przypięte SHA)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/maintenance-worker
