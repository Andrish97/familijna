name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    # Worker serwuje też pliki strony (wrangler.toml [assets]), więc każda
    # zmiana web/ i skryptów budujących artefakt wymaga nowego wdrożenia.
    paths:
      - "cloudflare/**"
      - "!cloudflare/legacy-domain-worker/**"
      - "web/**"
      - "scripts/version-assets.js"
      - "scripts/build-public.cjs"
      - "scripts/content-hash-assets.cjs"
      - "scripts/module-preload.cjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: true

# E24 R26: token GitHuba tylko do odczytu.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    # E24 R5: sekrety serwera i Cloudflare w środowisku „production” (reguła
    # gałęzi main ustawiana w GitHubie) — gałąź z podmienionym workflow ich nie dostanie.
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare/maintenance-worker

      # Pliki strony dla [assets] (_site_public): wersje ?v= z treści, minifikacja.
      # Ten sam skrypt co w Workers Builds (polecenie budowania w panelu Cloudflare).
      - name: Build site assets
        run: npm run build:site
        working-directory: cloudflare/maintenance-worker

      - name: Test Worker rendering and HTTPS
        run: npm test
        working-directory: cloudflare/maintenance-worker

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3 (E24 R16: przypięte SHA)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/maintenance-worker
