name: Version assets (?v= w repo)

# Po pushu na main przepisuje wersje ?v= w web/ i zapisuje je w repo
# („ci: update version hashes [skip ci]”) — źródła dla testów z gałęzi,
# zrzutów i scalania. Stronę wdraża deploy-worker.yml (Workers Static Assets),
# który sam liczy wersje z treści plików; GitHub Pages wyłączone 2026-11-21.

permissions:
  contents: write

concurrency:
  group: version-assets
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "searxng/**"
      - "supabase/**"
      - "cloudflare/**"
      - "services/**"
      - "tests/**"
      - "scripts/deploy-searxng.sh"
      - "scripts/deploy-edge.sh"
      - "scripts/apply-migrations.sh"
      - "scripts/deploy-lead-finder.sh"
      - ".github/workflows/**"
      - "README*"
      - "LICENSE*"
      - "*.md"
  workflow_dispatch: {}

jobs:
  version:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Version assets (cache busting)
        run: node scripts/version-assets.js

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: update version hashes [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
