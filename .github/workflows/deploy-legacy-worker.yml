name: Deploy legacy domain Worker

# Worker starej domeny familiada.online (przeprowadzka na familijna.app).
# Wdrażany automatycznie po zmianie jego kodu na main (decyzja właściciela
# 2026-11-08), najpierw testy; ręcznie też można. Trasy ustawia się w panelu
# Cloudflare (lista w cloudflare/legacy-domain-worker/wrangler.toml).
on:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/legacy-domain-worker/**"
      - ".github/workflows/deploy-legacy-worker.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-legacy-worker
  cancel-in-progress: false

# E24 R26: token GitHuba tylko do odczytu.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    # E24 R5: sekrety serwera i Cloudflare w środowisku „production” (reguła
    # gałęzi main ustawiana w GitHubie) — gałąź z podmienionym workflow ich nie dostanie.
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test legacy Worker
        run: npm test
        working-directory: cloudflare/legacy-domain-worker

      - name: Deploy legacy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3 (E24 R16: przypięte SHA)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/legacy-domain-worker
